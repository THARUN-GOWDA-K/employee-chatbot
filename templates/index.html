<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PeopleDesk · Employee Directory</title>
  <style>
    :root{--ink:#edf1ff;--muted:#a8b1cf;--line:rgba(255,255,255,.13);--panel:rgba(13,19,45,.62);--accent:#8b7cff;--teal:#5ce1c6;--danger:#ff7f9f}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d20;overflow-x:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(12px);pointer-events:none;z-index:-1}body:before{width:42rem;height:42rem;background:#372b83;top:-25rem;right:-12rem;opacity:.7}body:after{width:36rem;height:36rem;background:#00665e;bottom:-20rem;left:-13rem;opacity:.48}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:30px 0 48px}.top{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:34px}.brand{display:flex;align-items:center;gap:13px;font-weight:780;letter-spacing:-.03em;font-size:20px}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#a599ff,#5ce1c6);color:#11152d;box-shadow:0 8px 26px #0006}.eyebrow{font-size:12px;color:var(--teal);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:28px}.hero h1{font-size:clamp(31px,5vw,52px);letter-spacing:-.055em;line-height:1.02;margin:8px 0 11px}.hero p{margin:0;color:var(--muted);max-width:540px}.button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:700;color:#10142a;background:var(--teal);box-shadow:0 10px 25px #0004;transition:.2s}.button:hover{transform:translateY(-2px);filter:brightness(1.06)}.button.secondary{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card,.directory,dialog{background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px #0004;backdrop-filter:blur(18px)}.card{border-radius:18px;padding:18px}.card span{display:block;color:var(--muted);font-size:13px}.card strong{font-size:27px;letter-spacing:-.04em;display:block;margin-top:8px}.directory{border-radius:20px;overflow:hidden}.toolbar{padding:16px;display:flex;gap:12px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:0;background:#ffffff0c;border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink);font:inherit;outline:none}.search:focus{border-color:#9e95ff;box-shadow:0 0 0 3px #8b7cff2b}table{border-collapse:collapse;width:100%}th,td{padding:15px 18px;text-align:left;border-bottom:1px solid #ffffff0d}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}tr:last-child td{border:0}tbody tr{transition:background .18s}tbody tr:hover{background:#ffffff09}.person{display:flex;align-items:center;gap:11px;font-weight:700}.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#816ff0,#426b8e);font-size:12px}.role{display:inline-flex;padding:4px 9px;border-radius:999px;background:#ffffff12;color:#d8dcff;font-size:12px}.actions{display:flex;gap:7px}.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px;border-radius:7px;font-size:15px}.icon:hover{background:#fff1;color:white}.empty{padding:44px;text-align:center;color:var(--muted)}dialog{color:var(--ink);border-radius:20px;padding:0;width:min(460px,calc(100% - 32px));max-width:none}dialog::backdrop{background:#050716aa;backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px}.dialog-head h2{margin:0;font-size:21px}.form{padding:10px 22px 22px;display:grid;gap:14px}label{display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:650}input{width:100%;border:1px solid var(--line);border-radius:10px;background:#ffffff0b;color:var(--ink);padding:11px;font:inherit;outline:none}.form input:focus{border-color:var(--accent)}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:5px}.toast{position:fixed;right:24px;bottom:24px;background:#172243;border:1px solid var(--line);padding:12px 15px;border-radius:12px;box-shadow:0 12px 35px #0008;transform:translateY(80px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}.toast.error{border-color:#ff7f9f;color:#ffd3de}@media(max-width:760px){.shell{width:min(100% - 22px,1180px)}.top,.hero{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.directory{overflow:auto}table{min-width:680px}.toolbar{min-width:680px}}@media(max-width:420px){.cards{grid-template-columns:1fr}.hero h1{font-size:35px}}
  </style>
</head>
<body>
<main class="shell"><header class="top"><div class="brand"><span class="mark">✦</span> PeopleDesk</div><div class="eyebrow">Employee workspace</div></header>
<section class="hero"><div><div class="eyebrow">Directory</div><h1>Make people data<br>feel effortless.</h1><p>A focused, private workspace for maintaining an accurate employee directory.</p></div><button class="button" id="add">+ Add employee</button></section>
<section class="cards"><article class="card"><span>Total employees</span><strong id="headcount">—</strong></article><article class="card"><span>Active roles</span><strong id="roles">—</strong></article><article class="card"><span>Monthly payroll</span><strong id="payroll">—</strong></article><article class="card"><span>Average salary</span><strong id="average">—</strong></article></section>
<section class="directory"><div class="toolbar"><input id="search" class="search" placeholder="Search by name, role, or employee ID" aria-label="Search employees"><button class="button secondary" id="refresh">Refresh</button></div><table><thead><tr><th>Employee</th><th>ID</th><th>Role</th><th>Salary</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>No employees match your search.</div></section></main>
<dialog id="modal"><div class="dialog-head"><h2 id="title">Add employee</h2><button class="icon" id="close" aria-label="Close">✕</button></div><form id="form" class="form"><label>Employee ID<input name="employee_id" type="number" min="1" required></label><label>Full name<input name="name" minlength="2" maxlength="80" required></label><label>Position<input name="position" minlength="2" maxlength="80" required></label><label>Monthly salary<input name="salary" type="number" min="0" step="0.01" required></label><div class="form-actions"><button type="button" class="button secondary" id="cancel">Cancel</button><button class="button" id="save">Save employee</button></div></form></dialog><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),money=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});let editing=null,timer;const toast=(m,bad=false)=>{const t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' error':'');clearTimeout(timer);timer=setTimeout(()=>t.className='toast',3000)};const initials=n=>n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
async function request(url,options){const r=await fetch(url,options);const data=r.status===204?null:await r.json();if(!r.ok)throw Error(data.error||'Something went wrong.');return data}async function load(){try{const [list,stats]=await Promise.all([request('/api/employees?q='+encodeURIComponent($('#search').value)),request('/api/stats')]);$('#headcount').textContent=stats.headcount;$('#roles').textContent=stats.roles;$('#payroll').textContent=money.format(stats.payroll);$('#average').textContent=money.format(stats.average_salary);const rows=$('#rows');rows.innerHTML='';$('#empty').hidden=list.employees.length>0;list.employees.forEach(e=>{const tr=document.createElement('tr');tr.innerHTML='<td><div class="person"><span class="avatar">'+initials(e.name)+'</span><span></span></div></td><td></td><td><span class="role"></span></td><td></td><td><div class="actions"><button class="icon" title="Edit">✎</button><button class="icon" title="Delete">⌫</button></div></td>';tr.querySelector('.person span:last-child').textContent=e.name;tr.children[1].textContent='#'+e.employee_id;tr.querySelector('.role').textContent=e.position;tr.children[3].textContent=money.format(e.salary);tr.querySelectorAll('button')[0].onclick=()=>open(e);tr.querySelectorAll('button')[1].onclick=()=>remove(e);rows.append(tr)})}catch(e){toast(e.message,true)}}
function open(e){editing=e||null;$('#title').textContent=e?'Edit employee':'Add employee';const f=$('#form');f.reset();f.employee_id.disabled=!!e;if(e)Object.assign(f,{employee_id:{value:e.employee_id},name:{value:e.name},position:{value:e.position},salary:{value:e.salary}});$('#modal').showModal();if(!e)f.employee_id.focus()}function close(){$('#modal').close()}async function remove(e){if(!confirm('Remove '+e.name+' from the directory?'))return;try{await request('/api/employees/'+e.employee_id,{method:'DELETE'});toast('Employee removed');load()}catch(err){toast(err.message,true)}}
$('#add').onclick=()=>open();$('#close').onclick=close;$('#cancel').onclick=close;$('#refresh').onclick=load;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,220)};$('#form').onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget,p=Object.fromEntries(new FormData(f));p.employee_id=Number(p.employee_id);p.salary=Number(p.salary);try{await request(editing?'/api/employees/'+editing.employee_id:'/api/employees',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});close();toast(editing?'Employee updated':'Employee added');load()}catch(e){toast(e.message,true)}};load();
</script></body></html>
